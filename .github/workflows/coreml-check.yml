name: CoreML check

# Runs the app's own CoreML path on a Mac (integration_test/coreml_app_test.dart): the handwriting reader's 16-bit vision network one
# picture width at a time (its input size pinned), built once per width and loaded from the cache at the next start, and the formula
# encoder; both compared with the processor. A GitHub Mac is a virtual machine on Apple Silicon (no Neural Engine): the answers and the
# cache count, the times only roughly. integration_test/coreml_check_test.dart (raw sessions, every CoreML setting) is kept for by hand.
# Models (about 1.6 GB) are kept in the Actions cache.
on:
  workflow_dispatch:
  # (a hand-started workflow must be on the default branch first; until then, a push to this branch runs it)
  push:
    branches: [coreml-check]

concurrency:
  group: coreml-check-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  coreml:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: What machine this is
        run: |
          sysctl -n machdep.cpu.brand_string hw.memsize hw.ncpu
          sw_vers
          system_profiler SPDisplaysDataType || true
      - name: Models from the Actions cache
        id: models
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/models
          # (the checksums the app pins: a new file is a new key)
          key: coreml-models-8ea8a061-6194708c-e4565d57-7a4eedee-966e02f2-1c886fa0-9f74c48b-ba01e678
      - name: Download the models
        if: steps.models.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p models/teller models/glm
          get() { curl -fsSL --retry 3 -o "models/$1" "$2"; }
          get teller/encoder.onnx https://huggingface.co/nfa04/texteller-onnx-8bit/resolve/main/encoder.onnx
          get teller/encoder-gpu.onnx https://huggingface.co/nfa04/texteller-onnx-8bit/resolve/main/encoder-gpu.onnx
          get glm/vision.onnx https://huggingface.co/nfa04/glm-ocr-onnx/resolve/main/vision.onnx
          get glm/vision-gpu.onnx https://huggingface.co/nfa04/glm-ocr-onnx/resolve/main/vision-gpu.onnx
          get glm/vision-gpu.onnx.data https://huggingface.co/nfa04/glm-ocr-onnx/resolve/main/vision-gpu.onnx.data
          get glm/text.onnx https://huggingface.co/nfa04/glm-ocr-onnx/resolve/main/text.onnx
          get glm/embeddings.bin https://huggingface.co/nfa04/glm-ocr-onnx/resolve/main/embeddings.bin
          get teller/decoder.onnx https://huggingface.co/nfa04/texteller-onnx-8bit/resolve/main/decoder.onnx
      - name: Check the models
        working-directory: ${{ runner.temp }}/models
        run: |
          shasum -a 256 -c <<'EOF'
          8ea8a061533b7fd8fbb746b0bd9ddd8d26d324fe07647dcf9059ddd07c2d77c4  teller/encoder.onnx
          6194708cf94bf4b2a34a07bc08fe13279cd382f22772f54bd9082c11a3ff4563  teller/encoder-gpu.onnx
          e4565d57d7714b0b180718d8bb0a58d59fe7a68486028fe2fa774ce994f0f03a  glm/vision.onnx
          7a4eedee27741d1b5314bfc62de280b080790d62e52c1d51f417f8feb0e562c4  glm/vision-gpu.onnx
          966e02f241403b5cc83f5f2de76bb006a3137b96874df458418e50b64c00ee99  glm/vision-gpu.onnx.data
          1c886fa00f1b62c3a58728cadc49718c44fb046dca4e12171c1734cec9f00a41  glm/text.onnx
          9f74c48b8b5a645fbc438f2ee3c317a2102948149ff1deb3dfc678675b8094d5  glm/embeddings.bin
          ba01e6781c1acf48781e838433c185e71feccae11f40d84ee2a46ecca7ec5ad9  teller/decoder.onnx
          EOF
      - run: flutter pub get
      - name: Let the test read the models (the sandbox of the debug app only reaches its own container)
        run: /usr/libexec/PlistBuddy -c "Set :com.apple.security.app-sandbox false" macos/Runner/DebugProfile.entitlements
      - name: Control (a test that passes on these machines)
        # (it says whether the test setup works here; its thread-count check is flaky on these machines - 5 threads where 4 are allowed,
        # twice - so it does not stop the CoreML test)
        continue-on-error: true
        run: flutter test integration_test/session_priority_test.dart -d macos
      - name: Test
        timeout-minutes: 75
        run: |
          set -o pipefail
          # (what every thread of the app is doing, 15 and 35 minutes in: if the test hangs, this says where)
          ( for at in 900 1200; do sleep $at; pid=$(pgrep -n -f 'Notation.app/Contents/MacOS' || true)
              [ -n "$pid" ] && sample "$pid" 5 -file "$RUNNER_TEMP/sample-$at.txt" >/dev/null 2>&1; done ) &
          flutter test integration_test/coreml_app_test.dart -d macos \
            --dart-define=MODEL_DIR=${{ runner.temp }}/models --dart-define=OUT=${{ runner.temp }}/coreml.json --dart-define=REPO=${{ github.workspace }} 2>&1 | tee coreml.log
      - name: Summary
        if: always()
        run: |
          {
            echo '```'
            grep -E "coreml-app|All tests|Some tests" coreml.log || true
            echo '--- progress file'
            cat "$RUNNER_TEMP/coreml.json.progress" 2>/dev/null || echo '(none: the test never started)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coreml-check
          path: |
            coreml.log
            ${{ runner.temp }}/coreml.json*
            ${{ runner.temp }}/sample-*.txt
