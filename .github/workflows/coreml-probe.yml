name: CoreML probe

# Quick experiments with CoreML on a Mac in Python (minutes, against an hour for the app's own check): tool/coreml_probe/.
# Now: can the handwriting vision network (vision-gpu.onnx) be built when its input size is fixed (a free dimension override)?
# A GitHub Mac is a virtual Apple M1: the answers count, the times only roughly.
on:
  workflow_dispatch:
  push:
    branches: [coreml-check]
    paths:
      - tool/coreml_probe/**
      - .github/workflows/coreml-probe.yml

concurrency:
  group: coreml-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ONNX Runtime (the version of the app on Apple) and numpy
        run: pip install onnxruntime==1.28.0 numpy pillow onnx || pip install onnxruntime numpy pillow onnx
      - name: Models from the Actions cache (made by the CoreML check)
        id: models
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/models
          key: coreml-models-8ea8a061-6194708c-e4565d57-7f5cffc1-966e02f2
      - name: Download the vision network if the cache had none
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/models/glm"
          for f in vision-gpu.onnx vision-gpu.onnx.data; do
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/models/glm/$f" "https://huggingface.co/nfa04/glm-ocr-onnx/resolve/main/$f"
          done
      - name: Check it
        working-directory: ${{ runner.temp }}/models/glm
        run: |
          shasum -a 256 -c <<'EOF'
          7f5cffc1f3589d9c8c4322fd904903ddc5759c9df96880516533ca6ab17ccc0e  vision-gpu.onnx
          966e02f241403b5cc83f5f2de76bb006a3137b96874df458418e50b64c00ee99  vision-gpu.onnx.data
          EOF
      - name: Probe
        run: |
          python -c "import onnxruntime as o; print(o.__version__, o.get_available_providers())"
          model="$RUNNER_TEMP/models/glm/vision-gpu.onnx"; out="$RUNNER_TEMP/probe"; mkdir -p "$out"
          probe() { echo "::group::$*"; perl -e 'alarm shift; exec @ARGV' 900 python -I tool/coreml_probe/probe_glm_vision.py "$model" "$out" "$@" 2>&1 | tee -a probe.log | grep -E "probe-result|CoreML|partition|nodes|rror" | cut -c1-600; echo "(exit ${PIPESTATUS[0]})"; echo "::endgroup::"; }
          # a CoreML cache key in the model (tool/coreml_probe/add_cache_key.py): ONNX Runtime then names the cache by the key, not by a hash
          # of the model's path, so a model that moved (iOS can move an app's folder on an update) still finds its cache. Checked: build in
          # folder A, open the same files from folder B; with the key it must say "already cached", without it it builds again.
          a="$RUNNER_TEMP/keyA"; b="$RUNNER_TEMP/keyB"; mkdir -p "$a" "$b"
          python -I tool/coreml_probe/add_cache_key.py "$model" "$a/vision-gpu.onnx" glmocrvisiongpu1
          cp "$a/vision-gpu.onnx" "$b/vision-gpu.onnx"
          ln "$RUNNER_TEMP/models/glm/vision-gpu.onnx.data" "$a/vision-gpu.onnx.data"
          ln "$RUNNER_TEMP/models/glm/vision-gpu.onnx.data" "$b/vision-gpu.onnx.data"
          probe reference 10x48
          mkdir -p "$out/shared" "$out/plain"; cp "$out/ref-10x48.npy" "$out/shared/"
          for m in "$a/vision-gpu.onnx" "$b/vision-gpu.onnx"; do
            echo "::group::keyed model from $m"
            perl -e 'alarm shift; exec @ARGV' 900 python -I tool/coreml_probe/probe_glm_vision.py "$m" "$out/shared" coreml 10x48 ALL 1 2>&1 | tee "$out/log-$(basename $(dirname $m))" | grep -E "probe-result|already cached|rror" | sort | uniq -c | cut -c1-300
            echo "::endgroup::"
          done
          echo "B found the cache built from A: $(grep -c 'already cached' "$out/log-keyB") pieces (A: $(grep -c 'already cached' "$out/log-keyA"))" | tee -a probe.log
          cat "$out"/log-key* | grep probe-result >> probe.log
          ls "$out/shared"/*/ | head | tee -a probe.log
          # the same without a key: the copy in B must build again (proves the check above can fail)
          cp "$model" "$b/vision-plain.onnx"; cp "$model" "$a/vision-plain.onnx"
          for m in "$a/vision-plain.onnx" "$b/vision-plain.onnx"; do
            perl -e 'alarm shift; exec @ARGV' 900 python -I tool/coreml_probe/probe_glm_vision.py "$m" "$out/plain" coreml 10x48 ALL 1 > "$out/plain-$(basename $(dirname $m))" 2>&1 || true
          done
          echo "without a key, B found A's cache: $(grep -c 'already cached' "$out/plain-keyB") pieces" | tee -a probe.log
      - name: Summary
        if: always()
        run: |
          { echo '```'; grep -h "probe-result\|cache-\|onnx.data" probe.log || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coreml-probe
          path: probe.log
