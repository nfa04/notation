name: CI

on:
  # every branch (not tags: those are releases, see release.yml)
  push:
    branches: ['**']
  pull_request:

# one run per branch: a newer push cancels the one before it
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  analyze:
    # (a pull request from a branch of this repository has had its run when the branch was pushed: only one from a fork runs here)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # pdf_overlay is a package of its own: its tests (package:test) can only be resolved once it has had its own pub get,
      # which a fresh checkout has not (on a developer's machine its .dart_tool is already there)
      - run: dart pub get
        working-directory: pdf_overlay
      - run: flutter analyze
      - name: Tests of pdf_overlay
        run: dart test
        working-directory: pdf_overlay

  test:
    # (a pull request from a branch of this repository has had its run when the branch was pushed: only one from a fork runs here)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # The runner's own resolver sometimes cannot look up the ubuntu.com mirrors (packages.microsoft.com works at the same moment):
      # "Temporary failure resolving 'archive.ubuntu.com'", and apt then retried for an hour. So the name is looked up first, and if that
      # fails the network interface is pointed at public resolvers. apt gets short timeouts, a few tries, and the step a limit.
      - name: Linux build tools and libraries of the plugins
        timeout-minutes: 10
        run: |
          if ! getent hosts archive.ubuntu.com security.ubuntu.com; then
            echo "the runner's resolver cannot find the ubuntu mirrors:"
            resolvectl status 2>&1 | head -25 || cat /etc/resolv.conf
            iface=$(ip route show default | awk '{print $5; exit}')
            sudo resolvectl dns "$iface" 1.1.1.1 8.8.8.8 || echo "nameserver 1.1.1.1" | sudo tee /etc/resolv.conf
            sleep 2
            getent hosts archive.ubuntu.com security.ubuntu.com || echo "still no answer from the public resolvers"
          fi
          opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for try in 1 2 3; do
            sudo apt-get $opts update && sudo apt-get $opts install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libjsoncpp-dev liblzma-dev && exit 0
            echo "apt failed (try $try), waiting"; sleep 20
          done
          exit 1
      - run: flutter pub get
      # the plugins with native code (PDFium, SQLite, ONNX Runtime, QuickJS) are found in the bundle of a debug build
      - run: flutter build linux --debug
      - name: Tests
        run: flutter test
        env:
          LD_LIBRARY_PATH: build/linux/x64/debug/bundle/lib

  android:
    # (a pull request from a branch of this repository has had its run when the branch was pushed: only one from a fork runs here)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # (the disk of a free runner is full before this build is done: "No space left on device" in mergeDebugNativeLibs)
      - uses: ./.github/actions/android-room
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # one ABI is enough to know that it builds; --split-per-abi leaves the libraries of the other ABIs out of the APK
      - run: flutter build apk --debug --split-per-abi --target-platform android-arm64
