name: notes
description: "A note-taking and PDF-annotation app with handwriting, formulas, flashcards and on-device AI."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove thiys line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 0.0.2+2

environment:
  sdk: ^3.10.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  file_picker: ^13.0.0
  pdf: ^3.10.4
  qr: ^3.0.2
  pdf_overlay:
    path: pdf_overlay
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^2.0.0
  sqflite_common_ffi: ^2.4.0+3
  sqlite3_flutter_libs: ^0.6.0+eol
  path: ^1.9.1
  path_provider: ^2.1.6
  crypto: ^3.0.7
  archive: ^4.0.9
  flutter_localizations:
    sdk: flutter
  flutter_webrtc: ^1.0.0
  app_links: ^7.0.0
  cryptography: ^2.7.0
  web_socket_channel: ^3.0.0
  pdfrx: ^2.11.0
  # page-object editing (rewriting the text of an imported PDF) goes straight to PDFium, which pdfrx wraps without exposing it
  pdfium_dart: ^0.4.0
  ffi: ^2.1.0
  device_calendar_plus: ^0.12.0
  caldav: ^1.5.0
  # pinned: image 4.11.0 does not compile against the archive 4.0.9 that pdf/pdfrx
  # need; image >=4.12 needs pdf >=3.13, which clashes with caldav (xml 6 vs 7).
  # Revisit when caldav moves to xml 7.
  image: 4.10.2
  flutter_secure_storage: ^11.0.0
  dio: ^5.11.1
  flutter_onnxruntime: ^1.9.0
  flutter_math_fork: ^0.7.4
  webview_flutter: ^4.14.1
  url_launcher: ^6.3.3
  device_info_plus: ^13.0.0
  timezone: ^0.11.2
  pasteboard: ^0.6.0
  share_plus: ^13.0.0
  jsf: ^1.2.1
  image_picker: ^1.2.4
  local_auth: ^3.0.2
  flutter_tts: ^4.2.5
  record: ^7.1.2
  highlight: ^0.7.0
  qr_code_scanner_plus: ^2.3.2 # ZXing on Android (no Google ML Kit: F-Droid refuses it), AVFoundation on iOS
  connectivity_plus: ^7.3.2
  flutter_local_notifications: ^22.3.3
  just_audio: ^0.10.6
  html: ^0.15.7
  # reading Word documents into the written document (lib/markdown/docx_import.dart); caldav already pins it
  xml: ^6.6.1
  sqflite_common_ffi_web: ^1.2.0
  file: ^7.0.1
  # the web has no folders to ask for (lib/web/web_files_web.dart answers instead)
  path_provider_platform_interface: any
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
  plugin_platform_interface: any
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/glm_ocr/vocab.txt
    - assets/math/vocab.txt
    - assets/texteller/vocab.txt
    # Mozilla's root certificates, for Windows machines that lack some (lib/net/extra_roots.dart)
    - assets/certs/ca-bundle.pem
    - docs/extensions.md
    # the licences of the fonts and of the native libraries (lib/legal/bundled_licenses.dart)
    - assets/licenses/
    - assets/fonts/DejaVu-LICENSE.txt
    - assets/fonts/Liberation-LICENSE.txt

  # stand-ins for the fonts of an imported PDF while its text is edited (lib/pdf/pdf_stand_in_fonts.dart)
  fonts:
    - family: DejaVuSans
      fonts:
        - asset: assets/fonts/DejaVuSans.ttf
        - asset: assets/fonts/DejaVuSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/DejaVuSans-Oblique.ttf
          style: italic
        - asset: assets/fonts/DejaVuSans-BoldOblique.ttf
          weight: 700
          style: italic
    - family: LiberationSans
      fonts:
        - asset: assets/fonts/LiberationSans-Regular.ttf
        - asset: assets/fonts/LiberationSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/LiberationSans-Italic.ttf
          style: italic
        - asset: assets/fonts/LiberationSans-BoldItalic.ttf
          weight: 700
          style: italic
    - family: LiberationSerif
      fonts:
        - asset: assets/fonts/LiberationSerif-Regular.ttf
        - asset: assets/fonts/LiberationSerif-Bold.ttf
          weight: 700
        - asset: assets/fonts/LiberationSerif-Italic.ttf
          style: italic
        - asset: assets/fonts/LiberationSerif-BoldItalic.ttf
          weight: 700
          style: italic
    - family: LiberationMono
      fonts:
        - asset: assets/fonts/LiberationMono-Regular.ttf
        - asset: assets/fonts/LiberationMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/LiberationMono-Italic.ttf
          style: italic
        - asset: assets/fonts/LiberationMono-BoldItalic.ttf
          weight: 700
          style: italic

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# The web side of the plugin made ids that could repeat (see packages/flutter_onnxruntime/lib/web); otherwise the same as 1.9.0.
dependency_overrides:
  flutter_onnxruntime:
    path: packages/flutter_onnxruntime
