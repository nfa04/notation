# Input for flatpak-flutter (https://github.com/TheAppgineer/flatpak-flutter). It is NOT the manifest that goes to Flathub:
#   python3 flatpak-flutter.py flatpak-flutter.yml
# writes io.github.nfa04.notation.yml (+ pubspec-sources.json, flutter-sdk-*.json) next to it, with the Flutter SDK and every pub
# package pinned by hash. Those generated files are what the pull request to flathub/flathub contains. See flathub/README.md.
#
# Flathub builds without network access, so everything that the plugins download while building is given here as a pinned source
# and put where the plugin looks for it (the paths and hashes come from the locked package versions, see README.md for how to
# update them after a `flutter pub upgrade`).
app-id: io.github.nfa04.notation
runtime: org.gnome.Platform # GTK 3 and libsecret, which the Flutter runner and flutter_secure_storage link against
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm20 # Flutter compiles the Linux runner with clang (GNOME 50 is built on freedesktop 25.08)
command: notation

finish-args:
  - --share=ipc
  - --share=network # live collaboration, device and cloud sync
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio # sound, reading aloud, recording
  - --system-talk-name=org.freedesktop.NetworkManager # connectivity_plus: the app notices a move to another network
  - --talk-name=org.freedesktop.secrets # flutter_secure_storage keeps its keys in the keyring
  - --talk-name=org.freedesktop.Notifications # reminders

modules:
  # file_picker opens its file dialogs by running zenity (or qarma, or kdialog), and the runtime has none of them.
  # Inside the sandbox zenity 4 asks the file chooser portal, so the dialog is the one of the desktop.
  - name: zenity
    buildsystem: meson
    config-opts:
      - -Dmanpage=false # (needs help2man)
      - -Dwebkitgtk=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/zenity/4.2/zenity-4.2.2.tar.xz
        sha256: 019186a996096ef4fc356e21577b5673f5baa3a29ac8e3d608b753371c18018d

  - name: notation
    buildsystem: simple
    build-options:
      arch:
        x86_64:
          env:
            BUNDLE_PATH: build/linux/x64/release/bundle
            DART_ARCH: x64 # as the Dart build hooks and the plugins name the CPU
            PDFIUM_ARCH: x64
            ORT_ARCH: x64
        aarch64:
          env:
            BUNDLE_PATH: build/linux/arm64/release/bundle
            DART_ARCH: arm64
            PDFIUM_ARCH: arm64
            ORT_ARCH: aarch64
      append-path: /usr/lib/sdk/llvm20/bin:/run/build/notation/flutter/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm20/lib
      env:
        PUB_CACHE: /run/build/notation/.pub-cache
      # stripping would damage the AOT snapshot (libapp.so) and the prebuilt model runtimes
      strip: false
      no-debuginfo: true
    build-commands:
      # PDFium (pdfium_dart 0.4.1, release chromium/8125): its build hook takes libpdfium.so from the downloaded archive
      - install -Dm755 downloads/pdfium/lib/libpdfium.so .dart_tool/hooks_runner/shared/pdfium_dart/build/chromium_8125/linux-$DART_ARCH/libpdfium.so
      # SQLite (sqlite3 3.8.0 = SQLite 3.54.0): compiled from the amalgamation below instead of the prebuilt library the hook downloads
      - tool/use_sqlite_source.sh third_party/sqlite3/sqlite3.c
      # ONNX Runtime (flutter_onnxruntime 1.9.0): the plugin's CMake skips the download when this folder exists
      - mkdir -p build/linux/$DART_ARCH/release/plugins/flutter_onnxruntime/onnxruntime
      - cp -r downloads/onnxruntime build/linux/$DART_ARCH/release/plugins/flutter_onnxruntime/onnxruntime/onnxruntime-linux-$ORT_ARCH-1.28.3

      - flutter build linux --release --no-pub

      - mkdir -p /app/notation /app/bin
      - cp -r $BUNDLE_PATH/. /app/notation/
      - ln -s ../notation/notation /app/bin/notation
      - install -Dm644 macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_128.png /app/share/icons/hicolor/128x128/apps/io.github.nfa04.notation.png
      - install -Dm644 macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_256.png /app/share/icons/hicolor/256x256/apps/io.github.nfa04.notation.png
      - install -Dm644 macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_512.png /app/share/icons/hicolor/512x512/apps/io.github.nfa04.notation.png
      - install -Dm644 linux/io.github.nfa04.notation.metainfo.xml /app/share/metainfo/io.github.nfa04.notation.metainfo.xml
      # the same desktop file as the link handler of tool/install_linux_link_handler.sh, with the command of this package
      - mkdir -p /app/share/applications
      - sed 's|@EXEC@|notation|' linux/notation.desktop.in > /app/share/applications/io.github.nfa04.notation.desktop
      - echo 'Icon=io.github.nfa04.notation' >> /app/share/applications/io.github.nfa04.notation.desktop
    sources:
      - type: git
        url: https://github.com/nfa04/notation.git
        tag: v0.0.1
        # flatpak-flutter / Flathub want the commit of the tag as well: add `commit: <sha>` once the tag exists
      - type: git
        url: https://github.com/flutter/flutter.git
        tag: 3.47.7
        dest: flutter

      - type: archive
        only-arches: [x86_64]
        url: https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F8125/pdfium-linux-x64.tgz
        sha256: e1c3ce6e270cb5e0c20816b379ad9f2c1309972697c505f508de92bf5e7d6659
        strip-components: 0
        dest: downloads/pdfium
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F8125/pdfium-linux-arm64.tgz
        sha256: 8b8818f2ec57d1b213d952ca6d7f0ffeca9d0110487d0e20ad83ba918bc92efa
        strip-components: 0
        dest: downloads/pdfium

      - type: archive
        url: https://sqlite.org/2026/sqlite-amalgamation-3540000.zip
        sha256: 68e913b0fe8ec6b4e5f391c594a28872884e80d6cd042a1e50c957be46b5aa4d
        strip-components: 1
        dest: third_party/sqlite3

      - type: archive
        only-arches: [x86_64]
        url: https://github.com/microsoft/onnxruntime/releases/download/v1.28.3/onnxruntime-linux-x64-1.28.3.tgz
        sha256: db14e4863bd37893fc59729d986ab2a0d043d10b7d44da1913c4982b7e3d009c
        strip-components: 1
        dest: downloads/onnxruntime
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/microsoft/onnxruntime/releases/download/v1.28.3/onnxruntime-linux-aarch64-1.28.3.tgz
        sha256: 6c6b1ae96d7b0be9f555092857c6a4f2b0b5587a5298d732d9e52e8253038ce7
        strip-components: 1
        dest: downloads/onnxruntime

      # libwebrtc (flutter_webrtc 1.6.3, binary_version libwebrtc.m150.7871.07): third_party/CMakeLists.txt takes the zip from
      # third_party/downloads when it is there and extracts it
      - type: file
        only-arches: [x86_64]
        url: https://github.com/webrtc-sdk/libwebrtc/releases/download/libwebrtc.m150.7871.07/libwebrtc-linux-x64-release.zip
        sha256: ef380526cf9616848bc0b97b24990cbf2ad851c209d5dce93cc3ebb9d3789fbc
        dest: .pub-cache/hosted/pub.dev/flutter_webrtc-1.6.3/third_party/downloads
      - type: file
        only-arches: [aarch64]
        url: https://github.com/webrtc-sdk/libwebrtc/releases/download/libwebrtc.m150.7871.07/libwebrtc-linux-arm64-release.zip
        sha256: 887de0a1da6c9b8807da9fe2fc237e03ac5fcc3df4142a5f8889d66baa24bf08
        dest: .pub-cache/hosted/pub.dev/flutter_webrtc-1.6.3/third_party/downloads
